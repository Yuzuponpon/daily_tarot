<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日の1枚タロット</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: radial-gradient(circle at top, #283b6f, #050614 60%);
      color: #fefefe;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin: 4px 0 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #ddd;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .card-area {
      width: 100%;
      max-width: 260px;
      margin: 0 auto 10px;
      aspect-ratio: 3 / 5;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #f9e28a;
      color: #333;
      margin-bottom: 6px;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #hint {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 10px;
    }
    .result {
      margin-top: 10px;
      text-align: left;
      background: rgba(10, 13, 35, 0.9);
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
    }
    .result h2 {
      font-size: 16px;
      margin: 0 0 4px;
    }
    .result .keyword {
      font-size: 12px;
      color: #f9e28a;
      margin-bottom: 6px;
    }
    .insta-area {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
    }
    .insta-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 14px;
      text-decoration: none;
      color: #f9e28a;
      border-bottom: 1px solid #f9e28a;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>今日の1枚タロット</h1>
    <p class="subtitle">
      スタートを押して、シャカシャカ動くカードをタップしてね。<br>
      止まった1枚が、今日のあなたへのメッセージです。
    </p>

    <div class="card-area">
      <img id="card-image" src="cards/back.jpg" alt="タロットカード" />
    </div>

    <button id="start-btn">スタート</button>
    <p id="hint">スタート → カードをタップすると止まります</p>

    <div id="result" class="result hidden">
      <h2 id="card-title"></h2>
      <div id="card-keyword" class="keyword"></div>
      <p id="card-text"></p>

      <div class="insta-area">
        このタロットを描いたイラストレーター<br>
        <a
          id="insta-link"
          class="insta-link"
          href="https://www.instagram.com/あなたのアカウント名/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagramで他のイラストを見る
        </a>
      </div>
    </div>
  </div>

  <script>
    // ★ ここに16枚のカード情報を書く
    // 画像ファイル名に合わせて書き換えてね
    const cards = [
      {
        id: "0_TheFool",
        title: "愚者",
        keyword: "はじまり・自由・冒険",
        image: "cards/0_TheFool.jpg",
        text: "決めすぎないで、心がときめく方向に一歩踏み出してみて。失敗しても大丈夫、そこからまた学べます。"
      },
      {
        id: "1_TheMagician",
        title: "魔術師",
        keyword: "チャンス・集中・創造",
        image: "cards/1_TheMagician.jpg",
        text: "今のあなたは、持っているものを組み合わせて新しいものを生み出せるとき。ピンときたことに集中してみて。"
      },
      {
        id: "2_TheHighPriestess",
        title: "女教皇",
        keyword: "直感・静けさ・観察",
        image: "cards/2_TheHighPriestess.jpg",
        text: "慌てて答えを出さなくて大丈夫。静かな時間をとって、自分の直感の声を聞いてみて。"
      },
      {
        id: "3_TheEmpress",
        title: "女帝",
        keyword: "豊かさ・やさしさ・育てる",
        image: "cards/3_TheEmpress.jpg",
        text: "自分にも人にもやさしくすると、思った以上の豊かさが返ってきそう。好きなものに愛情を注いでみて。"
      },
      {
        id: "4_TheEmperor",
        title: "皇帝",
        keyword: "決断・責任・リーダーシップ",
        image: "cards/4_TheEmperor.jpg",
        text: "今日は「自分で決める」ことがテーマ。小さなことでも、自分の意思で選ぶことを意識してみて。"
      },
      {
        id: "5_TheHierophant",
        title: "法王",
        keyword: "学び・伝える・つながり",
        image: "cards/5_TheHierophant.jpg",
        text: "誰かから学ぶ・誰かに教える、どちらも良い日。安心できる人との対話がヒントをくれそうです。"
      },
      // ……この要領で 15 まで追加する……
    ];

    const cardImage = document.getElementById("card-image");
    const startBtn = document.getElementById("start-btn");
    const resultBox = document.getElementById("result");
    const titleEl = document.getElementById("card-title");
    const keywordEl = document.getElementById("card-keyword");
    const textEl = document.getElementById("card-text");

    let timer = null;
    let currentIndex = 0;

    function startRoulette() {
      if (cards.length === 0) return;

      resultBox.classList.add("hidden");
      startBtn.disabled = true;
      document.getElementById("hint").textContent = "カードをタップすると止まります";

      timer = setInterval(() => {
        currentIndex = Math.floor(Math.random() * cards.length);
        cardImage.src = cards[currentIndex].image;
      }, 70);
    }

    function stopRoulette() {
      if (!timer) return;

      clearInterval(timer);
      timer = null;

      const card = cards[currentIndex];
      cardImage.src = card.image;
      titleEl.textContent = card.title;
      keywordEl.textContent = card.keyword;
      textEl.textContent = card.text;

      resultBox.classList.remove("hidden");
      startBtn.disabled = false;
      startBtn.textContent = "もう一度引く";
      document.getElementById("hint").textContent = "もう一度引きたいときはボタンを押してね";
    }

    startBtn.addEventListener("click", startRoulette);
    cardImage.addEventListener("click", stopRoulette);
  </script>
</body>
</html>
