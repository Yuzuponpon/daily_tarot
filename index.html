<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日の1枚タロット</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: radial-gradient(circle at top, #283b6f, #050614 60%);
      color: #fefefe;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px 24px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 4px 0 6px;
      letter-spacing: 0.06em;
    }

    .subtitle {
      font-size: 13px;
      color: #dcdff5;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .card-area {
      width: 100%;
      max-width: 260px;
      margin: 0 auto 12px;
      aspect-ratio: 3 / 5;
      border-radius: 20px;
      overflow: hidden;
      background: radial-gradient(circle at top, #262f55, #050614);
      position: relative;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-area::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: radial-gradient(circle at top, rgba(248, 226, 138, 0.5), transparent 60%);
      opacity: 0.6;
      pointer-events: none;
    }

    .card-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 1;
      transition: transform 0.15s ease-out;
    }

    .card-area img:active {
      transform: scale(0.97);
    }

    button {
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #f9e28a, #f5c76d);
      color: #3c310c;
      margin-bottom: 6px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, filter 0.1s;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      filter: brightness(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow: none;
    }

    #hint {
      font-size: 12px;
      color: #b9bedf;
      margin-bottom: 12px;
    }

    .result {
      margin-top: 10px;
      text-align: left;
      background: rgba(10, 13, 35, 0.92);
      padding: 14px 14px 12px;
      border-radius: 16px;
      font-size: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .result h2 {
      font-size: 17px;
      margin: 0 0 4px;
    }

    .result .keyword {
      font-size: 12px;
      color: #f9e28a;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .insta-area {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
    }

    .insta-text {
      margin-bottom: 6px;
      color: #dcdff5;
      font-size: 12px;
    }

    /* ▼ インスタ用ボタン（aタグだけどボタンっぽく） */
    .insta-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      color: #0b0c1a;
      background: linear-gradient(135deg, #ffe3a7, #ffb8c9);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      border: none;
      cursor: pointer;
    }

    .insta-link span.icon {
      font-size: 14px;
    }

    .insta-link:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>今日の1枚タロット</h1>
    <p class="subtitle">
      スタートを押して、シャカシャカ動くカードをタップしてね。<br>
      止まった1枚が、今日のあなたへのメッセージです。
    </p>

    <div class="card-area">
      <img id="card-image" src="./cards/back.png" alt="タロットカード" />
    </div>

    <button id="start-btn">スタート</button>
    <p id="hint">スタート → カードをタップすると止まります</p>

    <div id="result" class="result hidden">
      <h2 id="card-title"></h2>
      <div id="card-keyword" class="keyword"></div>
      <p id="card-text"></p>

      <div class="insta-area">
        <div class="insta-text">このタロットを描いたイラストレーター</div>
        <!-- ここをボタンっぽいリンクに変更 -->
        <a
          id="insta-link"
          class="insta-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">✦</span>
          <span>Instagramでイラストを見る</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Instagram ボタン用（参考コードを反映）
    const instagramUrl = "https://www.instagram.com/yuzukosho34/";
    const instaLink = document.getElementById("insta-link");
    instaLink.href = instagramUrl;

    // ★ ここに16枚のカード情報を書く
    const cards = [
     {
    id: "0_TheFool",
    title: "愚者",
    keyword: "はじまり・自由・冒険",
    image: "./cards/0_TheFool.png",
    text: "決めすぎないで、心がときめく方向に一歩。風みたいに軽やかに進めば、思いがけない景色があなたを待っています。"
  },
  {
    id: "1_TheMagician",
    title: "魔術師",
    keyword: "創造・可能性・スタート",
    image: "./cards/1_TheMagician.png",
    text: "いま手元にある小さな道具が、魔法の材料。『できる』を信じて組み合わせた瞬間、世界が動き出します。"
  },
  {
    id: "2_TheHighPriestess",
    title: "女教皇",
    keyword: "直感・静けさ・内なる声",
    image: "./cards/2_TheHighPriestess.png",
    text: "答えは外じゃなく、静かな胸の奥に。夜の水面みたいに心を落ち着けると、本当のサインが浮かび上がります。"
  },
  {
    id: "3_TheEmpress",
    title: "女帝",
    keyword: "豊かさ・愛情・育む",
    image: "./cards/3_TheEmpress.png",
    text: "受け取っていい日。やさしさや美しさを遠慮なく味わって。あなたが満ちるほど、周りもあたたかく照らされます。"
  },
  {
    id: "4_TheEnperor",
    title: "皇帝",
    keyword: "基盤・守る・決断",
    image: "./cards/4_TheEmperor.png",
    text: "ふわっとした夢を、形にするタイミング。境界線をやさしく引いて、守りたいものを守る。あなたの芯が道しるべです。"
  },
  {
    id: "5_TheHierophant",
    title: "教皇",
    keyword: "学び・伝統・導き",
    image: "./cards/5_TheHierophant.png",
    text: "一人で抱えなくていいよ。信頼できる教えや先人の知恵に触れるほど、あなたの迷いは静かにほどけていきます。"
  },
  {
    id: "6_TheLovers",
    title: "恋人",
    keyword: "選択・調和・心で決める",
    image: "./cards/6_TheLovers.png",
    text: "大切なのは、正しさより『好き』。誰かとの関係も、自分の選択も、胸が温かくなる方を選んでください。"
  },
  {
    id: "7_TheChariot",
    title: "戦車",
    keyword: "前進・意志・突破",
    image: "./cards/7_TheChariot.png",
    text: "進むって決めたあなたは強い。揺れる気持ちを手綱みたいに整えて、行きたい場所へ。勢いは味方になります。"
  },
  {
    id: "8_Strength",
    title: "力",
    keyword: "優しさの強さ・忍耐・信頼",
    image: "./cards/8_Strength.png",
    text: "押し切る強さじゃなく、抱きしめる強さ。焦らず、怯えも否定せずに寄り添えば、心の獣は静かに落ち着きます。"
  },
  {
    id: "9_TheHermit",
    title: "隠者",
    keyword: "内省・探求・ひとりの光",
    image: "./cards/9_TheHermit.png",
    text: "少しだけ静かな場所へ。小さなランタンの光が、いちばん大事な真実を照らします。急がなくて大丈夫。"
  },
  {
    id: "10_WheelofFortune",
    title: "運命の輪",
    keyword: "転機・流れ・チャンス",
    image: "./cards/10_WheelofFortune.png",
    text: "景色がくるっと変わる予感。流れに逆らわず、波に乗る準備を。偶然みたいな出来事が、未来の扉になります。"
  },
  {
    id: "11_Justice",
    title: "正義",
    keyword: "バランス・誠実・整える",
    image: "./cards/11_Justice.png",
    text: "心と現実の天秤を、そっと水平に。感情を大切にしながらも、事実を見て整えると、あなたらしい答えが出ます。"
  },
  {
    id: "12_TheHangedMan",
    title: "吊るされた男",
    keyword: "手放す・視点の転換・待つ",
    image: "./cards/12_TheHangedMan.png",
    text: "いまは動かないことが、いちばんの前進かも。視点を逆さにすると、今まで見えなかった優しい道が見つかります。"
  },
  {
    id: "13_Death",
    title: "死神",
    keyword: "終わり・変容・新しい始まり",
    image: "./cards/13_Death.png",
    text: "終わりは、怖い顔をして来るけれど、本当は再生の合図。もう役目を終えたものを手放して、軽い心で次へ。"
  },
  {
    id: "14_Temperance",
    title: "節制",
    keyword: "調和・癒し・ちょうどいい",
    image: "./cards/14_Temperance.png",
    text: "混ぜ合わせて、やさしい色にする日。急がず、少しずつ整えれば大丈夫。あなたのペースが、最適解です。"
  },
  {
    id: "15_TheDevil",
    title: "悪魔",
    keyword: "執着・誘惑・本音",
    image: "./cards/15_TheDevil.png",
    text: "『離れたいのに離れられない』に気づいたら、もう半分解けてる。鎖は意外とゆるいよ。望みを正直に見てみて。"
  },
  {
    id: "16_TheTower",
    title: "塔",
    keyword: "崩壊・目覚め・真実",
    image: "./cards/16_TheTower.png",
    text: "壊れるのは、偽りの積み木だけ。痛みのあとに、空が広く見える。ほんとうのあなたが戻ってくるサインです。"
  },
  {
    id: "17_TheStar",
    title: "星",
    keyword: "希望・導き・やさしい未来",
    image: "./cards/17_TheStar.png",
    text: "暗い夜ほど、星はきれい。小さな希望を抱きしめて。あなたの願いは、静かに現実へ向かって育っています。"
  },
  {
    id: "18_TheMoon",
    title: "月",
    keyword: "揺らぎ・幻想・不安と直感",
    image: "./cards/18_TheMoon.png",
    text: "見えにくい夜は、想像が大きくなる。怖さが出ても責めないで。霧が晴れるまで、足元の光だけを信じて進もう。"
  },
  {
    id: "19_TheSun",
    title: "太陽",
    keyword: "喜び・祝福・素直さ",
    image: "./cards/19_TheSun.png",
    text: "まっすぐ笑っていい日。うれしいを隠さずに受け取るほど、世界は明るく返してくれます。あなたの輝きは本物。"
  },
  {
    id: "20_Judgement",
    title: "審判",
    keyword: "目覚め・再出発・呼び声",
    image: "./cards/20_Judgement.png",
    text: "遠くから呼ばれている気がするなら、それが合図。過去の自分もまるごと抱えて、もう一度スタートしていい。"
  },
  {
    id: "21_TheWorld",
    title: "世界",
    keyword: "完成・統合・旅の到達点",
    image: "./cards/21_TheWorld.png",
    text: "ここまで来たあなたを、世界が祝福しています。終わりは新しい循環の入り口。次の物語へ、軽やかに手を伸ばして。"
  }
      // ……この要領で 15 まで追加する……
    ];

    const cardImage = document.getElementById("card-image");
    const startBtn = document.getElementById("start-btn");
    const resultBox = document.getElementById("result");
    const titleEl = document.getElementById("card-title");
    const keywordEl = document.getElementById("card-keyword");
    const textEl = document.getElementById("card-text");

    let timer = null;
    let currentIndex = 0;

    function startRoulette() {
      if (cards.length === 0) return;

      resultBox.classList.add("hidden");
      startBtn.disabled = true;
      document.getElementById("hint").textContent = "カードをタップすると止まります";

      timer = setInterval(() => {
        currentIndex = Math.floor(Math.random() * cards.length);
        cardImage.src = cards[currentIndex].image;
      }, 70);
    }

    function stopRoulette() {
      if (!timer) return;

      clearInterval(timer);
      timer = null;

      const card = cards[currentIndex];
      cardImage.src = card.image;
      titleEl.textContent = card.title;
      keywordEl.textContent = card.keyword;
      textEl.textContent = card.text;

      resultBox.classList.remove("hidden");
      startBtn.disabled = false;
      startBtn.textContent = "もう一度引く";
      document.getElementById("hint").textContent = "もう一度引きたいときはボタンを押してね";
    }

    startBtn.addEventListener("click", startRoulette);
    cardImage.addEventListener("click", stopRoulette);
  </script>
</body>
</html>
